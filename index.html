  <style>
    body {
      background-color: #ffffff;
      color: #1e293b;
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      word-break: keep-all;
      /* 한글 단어 끊김 방지 */
    }

    h1,
    h2,
    h3,
    h4 {
      letter-spacing: -0.03em;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Hero title: blue → deep navy → purple, drifting slowly across the text */
    .text-flow {
      background-image: linear-gradient(100deg, #2b5cff 0%, #1b2d7a 28%, #6d3df5 55%, #3f7bff 78%, #2b5cff 100%);
      background-size: 250% 100%;
      background-position: 0% 50%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: text-flow 9s ease-in-out infinite alternate;
    }

    @keyframes text-flow {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }

    /* Dot-matrix texture: the glyphs are 45% solid + a grid of dots that drifts diagonally */
    .text-dots {
      -webkit-mask-image:
        radial-gradient(circle, #000 1.15px, transparent 1.6px),
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45));
      mask-image:
        radial-gradient(circle, #000 1.15px, transparent 1.6px),
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45));
      -webkit-mask-size: 7px 7px, 100% 100%;
      mask-size: 7px 7px, 100% 100%;
      -webkit-mask-position: 0 0, 0 0;
      mask-position: 0 0, 0 0;
      animation: text-flow 9s ease-in-out infinite alternate, text-dots 14s linear infinite;
    }

    @keyframes text-dots {
      from { -webkit-mask-position: 0 0, 0 0; mask-position: 0 0, 0 0; }
      to { -webkit-mask-position: 70px 35px, 0 0; mask-position: 70px 35px, 0 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .text-flow, .text-dots { animation: none; background-position: 40% 50%; }
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
  </style>
